name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (py${{ matrix.python-version }} on linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, self-hosted-mikey]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 8  # evidence freshness tests allow bundles up to 5 commits behind HEAD
          persist-credentials: false

      - name: Configure isolated git identity (for tests that init tmp repos)
        run: |
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig-${{ matrix.python-version }}"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global user.email "ci@merge-train.test"
          git config --global user.name "merge_train CI"

      - name: Set up Node 22 (required by opencode plugin tests)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }} venv and install package
        run: |
          VENV_DIR="${RUNNER_TEMP}/venv-${{ matrix.python-version }}"
          uv venv --clear "$VENV_DIR" --python "${{ matrix.python-version }}"
          uv pip install --python "$VENV_DIR/bin/python" -e '.[dev]'
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      - name: Show versions
        # `head` closes the pipe early; under bash's default pipefail this
        # can surface as SIGPIPE (exit 141) on slow runners. Tolerate it.
        run: |
          set +o pipefail
          python --version
          git --version
          uv pip show --python "${RUNNER_TEMP}/venv-${{ matrix.python-version }}/bin/python" merge_train | head -5

      - name: Run pytest
        run: python -m pytest tests/ -q

      - name: Clean up isolated venv
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -rf "${RUNNER_TEMP}/venv-${{ matrix.python-version }}" "${RUNNER_TEMP}/gitconfig-${{ matrix.python-version }}"
          fi

  pytest-macos:
    name: pytest (macOS native)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted-native-macos]
    env:
      GIT_AUTHOR_NAME: merge_train CI
      GIT_AUTHOR_EMAIL: ci@merge-train.test
      GIT_COMMITTER_NAME: merge_train CI
      GIT_COMMITTER_EMAIL: ci@merge-train.test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 8  # evidence freshness tests allow bundles up to 5 commits behind HEAD
          persist-credentials: false

      - name: Configure isolated git identity (for tests that init tmp repos)
        run: |
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig-macos"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global user.email "ci@merge-train.test"
          git config --global user.name "merge_train CI"

      - name: Set up isolated Python venv and install package
        run: |
          export PATH="$HOME/.local/bin:$HOME/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          PY_BIN="$(command -v python3.12 || command -v python3.13 || command -v python3)"
          VENV_DIR="${RUNNER_TEMP}/venv-macos"
          if command -v uv >/dev/null 2>&1; then
            uv venv --clear "$VENV_DIR" --python "$PY_BIN"
            uv pip install --python "$VENV_DIR/bin/python" -e '.[dev]'
          else
            "$PY_BIN" -m venv --clear "$VENV_DIR"
            "$VENV_DIR/bin/pip" install -q --upgrade pip
            "$VENV_DIR/bin/pip" install -q -e '.[dev]'
          fi
          echo "VENV_PYTHON=${VENV_DIR}/bin/python" >> "$GITHUB_ENV"
          # GITHUB_PATH prepends each line, so the LAST line written has highest precedence.
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          if [ -d "$HOME/.nvm/versions/node/v22.22.0/bin" ]; then
            echo "$HOME/.nvm/versions/node/v22.22.0/bin" >> "$GITHUB_PATH"
          fi
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          set +o pipefail
          python -c 'import os, sys; assert os.path.realpath(sys.prefix) == os.path.realpath(os.environ["RUNNER_TEMP"] + "/venv-macos"), (sys.prefix, sys.executable); print(sys.version, sys.executable)'
          "$VENV_PYTHON" -c 'import os, sys; assert os.path.realpath(sys.prefix) == os.path.realpath(os.environ["RUNNER_TEMP"] + "/venv-macos"), (sys.prefix, sys.executable); print(sys.version, sys.executable)'
          node --version || true
          git --version

      - name: Run pytest
        run: |
          "$VENV_PYTHON" -m pytest tests/ -q

      - name: Clean up isolated macOS venv
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -rf "${RUNNER_TEMP}/venv-macos" "${RUNNER_TEMP}/gitconfig-macos"
          fi

  installer-smoke:
    name: install.sh smoke (self-hosted linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, self-hosted-mikey]
    needs: [pytest, pytest-macos]
    steps:
      - name: Checkout merge_train
        uses: actions/checkout@v4
        with:
          path: merge_train
          persist-credentials: false

      - name: Configure isolated git identity
        run: |
          export GIT_CONFIG_GLOBAL="${RUNNER_TEMP}/gitconfig-smoke"
          echo "GIT_CONFIG_GLOBAL=${GIT_CONFIG_GLOBAL}" >> "$GITHUB_ENV"
          git config --global user.email "ci@merge-train.test"
          git config --global user.name "merge_train CI"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12 venv
        run: |
          VENV_DIR="${RUNNER_TEMP}/venv-smoke"
          uv venv --clear "$VENV_DIR" --python "3.12"
          # GITHUB_PATH prepends each line, so write $VENV_DIR/bin LAST for highest precedence.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      - name: Create a fresh target repo
        run: |
          SMOKE_DIR="$(mktemp -d "${RUNNER_TEMP}/installer-smoke.XXXXXX")"
          echo "SMOKE_DIR=${SMOKE_DIR}" >> "$GITHUB_ENV"
          mkdir -p "$SMOKE_DIR/target_repo"
          cd "$SMOKE_DIR/target_repo"
          git init -q -b main

      - name: Run install.sh against the target repo
        run: ./merge_train/install.sh "$SMOKE_DIR/target_repo"

      - name: Verify install artifacts
        run: |
          set +o pipefail
          test -L "$SMOKE_DIR/target_repo/.git/hooks/pre-commit" || { echo "hook not symlinked"; exit 1; }
          predict-conflicts --help | head -5

      - name: Re-run install.sh (idempotency check)
        run: ./merge_train/install.sh "$SMOKE_DIR/target_repo" 2>&1 | tee "$SMOKE_DIR/rerun.log"
        # The re-run must NOT clobber the hook.

      - name: Confirm idempotent — hook untouched
        run: |
          grep -q "already symlinked" "$SMOKE_DIR/rerun.log"

      - name: Clean up isolated smoke venv
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -rf "${RUNNER_TEMP}/venv-smoke" "${RUNNER_TEMP}/gitconfig-smoke"
          fi
          if [ -n "${SMOKE_DIR:-}" ] && [ -d "${SMOKE_DIR}" ]; then
            rm -rf "${SMOKE_DIR}"
          fi
