name: evidence-guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-archive-integrity:
    name: Evidence archive integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify archival sha256 sidecars
        run: |
          FAIL=0
          BUNDLES=(evidence/v0.3 evidence/v0.4 evidence/v0.4-ao evidence/v0.5-ao evidence/v0.6-ao)
          for BUNDLE_DIR in "${BUNDLES[@]}"; do
            if [ ! -d "$BUNDLE_DIR" ]; then
              echo "MISSING bundle: $BUNDLE_DIR"
              FAIL=1
              continue
            fi
            if [ ! -f "$BUNDLE_DIR/metadata.json" ]; then
              echo "MISSING metadata: $BUNDLE_DIR/metadata.json"
              FAIL=1
              continue
            fi
            while IFS= read -r -d '' f; do
              sidecar="${f}.sha256"
              if [ ! -f "$sidecar" ]; then
                echo "MISSING sidecar: $sidecar"
                FAIL=1
                continue
              fi
              EXPECTED=$(sha256sum "$f" | awk '{print $1}')
              ACTUAL=$(awk '{print $1}' "$sidecar")
              if [ "$EXPECTED" != "$ACTUAL" ]; then
                echo "MISMATCH: $f (expected $EXPECTED, sidecar says $ACTUAL)"
                FAIL=1
              fi
            done < <(find "$BUNDLE_DIR" -type f ! -name "*.sha256" -print0)
          done
          if [ "$FAIL" -eq 1 ]; then
            echo "FAIL: sha256 sidecar verification failed" >&2
            exit 1
          fi
          echo "PASS: all archival evidence sidecars valid"
